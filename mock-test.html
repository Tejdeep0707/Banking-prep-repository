<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Test Engine | QUALISBANKING EXAMS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background: #f0f2f5;">
    <header class="sticky-header">
        <nav class="nav-bar">
            <h1>QUALISBANKING EXAMS</h1>
            <a href="index.html" style="text-decoration: none; color: var(--primary-color); font-weight: 600;"><i class="fas fa-times"></i> Exit Test</a>
        </nav>
    </header>

    <div class="container" style="max-width: 900px; margin: 0 auto; padding: 20px;">
        <!-- Test Interface -->
        <div id="test-interface" class="test-container animate-up">
            <div class="progress-wrapper">
                <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: 600; color: var(--text-light);">
                    <span id="question-number">Question 1 of 5</span>
                    <span id="topic-tag" style="color: var(--accent-color);">Topic: Loading...</span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>

            <div id="question-container" style="margin-top: 40px;">
                <div id="question-text" class="question-text" style="font-size: 1.4rem; font-weight: 600; margin-bottom: 30px; line-height: 1.4;">Loading question...</div>
                <div id="options-list" class="options-list">
                    <!-- Options injected by JS -->
                </div>
            </div>

            <div class="test-footer" style="display: flex; justify-content: space-between; align-items: center; margin-top: 50px; padding-top: 30px; border-top: 1px solid #eee;">
                <button id="prev-btn" class="btn hidden" style="background: #e2e8f0; color: #475569;">Previous</button>
                <div style="flex-grow: 1;"></div>
                <button id="next-btn" class="btn btn-disabled" disabled style="background: #cbd5e1; color: #94a3b8;">Next Question</button>
                <button id="submit-btn" class="btn btn-primary hidden">Submit Final Test</button>
            </div>
        </div>

        <!-- Results Interface -->
        <div id="results-interface" class="test-container hidden animate-up">
            <div style="text-align: center;">
                <div style="font-size: 3rem; color: var(--accent-color); margin-bottom: 10px;"><i class="fas fa-trophy"></i></div>
                <h2 style="font-size: 2rem; margin-bottom: 10px;">Test Completed!</h2>
                <div id="results-score" class="results-score" style="font-size: 4rem; font-weight: 800; color: var(--primary-color); margin: 20px 0;">0/0</div>
                
                <div id="performance-msg" class="performance-msg" style="display: inline-block; padding: 10px 25px; border-radius: 50px; font-weight: 600; margin-bottom: 40px;">Good performance</div>

                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px;">
                    <div style="background: #f8fafc; padding: 20px; border-radius: 15px;">
                        <span style="display: block; font-size: 1.5rem; font-weight: 700;" id="total-attempted">0</span>
                        <span style="font-size: 0.8rem; color: #64748b; text-transform: uppercase;">Attempted</span>
                    </div>
                    <div style="background: #f0fdf4; padding: 20px; border-radius: 15px; color: #16a34a;">
                        <span style="display: block; font-size: 1.5rem; font-weight: 700;" id="correct-answers">0</span>
                        <span style="font-size: 0.8rem; color: #16a34a; text-transform: uppercase;">Correct</span>
                    </div>
                    <div style="background: #f1f5f9; padding: 20px; border-radius: 15px;">
                        <span style="display: block; font-size: 1.5rem; font-weight: 700;" id="accuracy-pct">0%</span>
                        <span style="font-size: 0.8rem; color: #64748b; text-transform: uppercase;">Accuracy</span>
                    </div>
                </div>

                <a href="index.html" class="btn btn-primary" style="width: 100%;">Return to Dashboard</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
