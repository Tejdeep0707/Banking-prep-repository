<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup | QUASIBANKING EXAMS</title>
    <link rel="icon" type="image/jpeg" href="RESOURCES/ICONATRIGHTTOPCORNER.jpeg">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .auth-container { 
            max-width: 450px; 
            margin: 60px auto; 
            padding: 40px; 
            background: var(--bg-card); 
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 32px; 
            box-shadow: var(--shadow-premium); 
        }
        .auth-toggle { 
            display: flex; 
            margin-bottom: 30px; 
            background: rgba(255,255,255,0.05); 
            padding: 6px; 
            border-radius: 16px; 
        }
        .auth-toggle button { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            background: transparent; 
            border-radius: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: var(--transition); 
            color: var(--text-muted); 
        }
        .auth-toggle button.active { 
            background: var(--primary-color); 
            color: white; 
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); 
        }
        .form-group { margin-bottom: 24px; }
        .form-group label { 
            display: block; 
            margin-bottom: 10px; 
            font-weight: 500; 
            font-size: 0.9rem; 
            color: var(--text-muted);
        }
        .form-group input { 
            width: 100%; 
            padding: 14px 18px; 
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border); 
            border-radius: 14px; 
            font-size: 1rem; 
            color: white;
            transition: var(--transition); 
        }
        .form-group input:focus { 
            border-color: var(--primary-color); 
            outline: none; 
            background: rgba(99, 102, 241, 0.05); 
        }
        .error-msg { 
            color: #ef4444; 
            background: rgba(239, 68, 68, 0.1); 
            padding: 14px; 
            border-radius: 12px; 
            margin-bottom: 24px; 
            font-size: 0.85rem; 
            display: none; 
            border: 1px solid rgba(239, 68, 68, 0.2); 
        }
        .auth-footer { text-align: center; margin-top: 30px; font-size: 0.9rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <header class="sticky-header">
        <nav class="nav-bar">
            <div class="nav-left">
                <a href="index.html" class="logo-link"><img src="RESOURCES/MAINWEBSITELOGO.jpeg" alt="LOGO" class="nav-logo"></a>
            </div>
            <a href="index.html" class="btn btn-outline" style="font-size: 0.85rem; padding: 8px 16px;">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </nav>
    </header>

    <div class="auth-container">
        <div class="auth-toggle">
            <button id="btn-login" class="active">Login</button>
            <button id="btn-signup">Sign Up</button>
        </div>

        <h2 id="form-title" style="margin-bottom: 8px; font-weight: 800; letter-spacing: -0.5px;">Welcome Back</h2>
        <p id="form-subtitle" style="color: var(--text-muted); margin-bottom: 30px; font-size: 0.95rem;">Please enter your details to continue.</p>
        
        <div id="error-display" class="error-msg"></div>

        <form id="auth-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="email@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 16px; border-radius: 14px; font-size: 1rem;">Login to Account</button>
        </form>

        <div class="auth-footer" id="footer-text">
            Don't have an account? <a href="#" onclick="toggleMode(false)" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Create one</a>
        </div>
    </div>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
</body>
</html>
