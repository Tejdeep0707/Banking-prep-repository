<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup | QUASIBANKING EXAMS</title>
    <link rel="icon" type="image/jpeg" href="RESOURCES/ICONATRIGHTTOPCORNER.jpeg">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page" data-theme="light">
    <header class="sticky-header">
        <nav class="nav-bar">
            <div class="nav-left">
                <a href="index.html" class="logo-link"><img src="RESOURCES/MAINWEBSITELOGO.jpeg" alt="LOGO" class="nav-logo"></a>
            </div>
            <a href="index.html" class="btn btn-outline auth-back-btn">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </nav>
    </header>

    <div class="auth-container" id="auth-card">
        <div class="auth-toggle" id="auth-toggle">
            <button type="button" id="btn-login" class="active">Login</button>
            <button type="button" id="btn-signup">Sign Up</button>
        </div>

        <h2 id="form-title">Welcome Back</h2>
        <p id="form-subtitle">Please enter your details to continue.</p>

        <div id="success-display" class="success-msg" role="status" aria-live="polite"></div>
        <div id="error-display" class="error-msg" role="alert" aria-live="assertive"></div>

        <!-- Login / Sign up -->
        <form id="auth-form" novalidate>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                <span class="field-error" id="email-error"></span>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="password">Password</label>
                    <button type="button" id="forgot-password-link" class="text-link">Forgot password?</button>
                </div>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                    <button type="button" id="toggle-password" class="password-toggle" aria-label="Show password">
                        <i class="fas fa-eye" id="toggle-password-icon"></i>
                    </button>
                </div>
                <span class="field-error" id="password-error"></span>
                <ul id="password-rules" class="password-rules" hidden>
                    <li data-rule="length"><i class="fas fa-circle"></i> At least 8 characters</li>
                    <li data-rule="upper"><i class="fas fa-circle"></i> One uppercase letter</li>
                    <li data-rule="lower"><i class="fas fa-circle"></i> One lowercase letter</li>
                    <li data-rule="special"><i class="fas fa-circle"></i> One special character</li>
                </ul>
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary auth-submit-btn">
                <span id="submit-label">Login to Account</span>
            </button>
        </form>

        <!-- Forgot password -->
        <form id="forgot-form" class="auth-panel" hidden novalidate>
            <p class="panel-desc">Enter your email and we'll send a password reset link.</p>
            <div class="form-group">
                <label for="reset-email">Email Address</label>
                <input type="email" id="reset-email" placeholder="you@example.com" autocomplete="email" required>
                <span class="field-error" id="reset-email-error"></span>
            </div>
            <button type="submit" id="reset-submit-btn" class="btn btn-primary auth-submit-btn">
                <span>Send Reset Link</span>
            </button>
            <button type="button" id="back-to-login" class="btn btn-outline auth-back-form-btn">Back to Login</button>
        </form>

        <div class="auth-footer" id="footer-text">
            Don't have an account? <a href="#" id="footer-toggle-link">Create one</a>
        </div>
    </div>

    <div id="auth-loading" class="auth-loading" hidden aria-hidden="true">
        <div class="auth-loading-card">
            <div class="auth-spinner" aria-hidden="true"></div>
            <p id="loading-text">Processing...</p>
        </div>
    </div>

    <script type="module" src="auth.js"></script>
</body>
</html>
